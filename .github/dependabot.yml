version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze must share one version, so bump them together
      codeql-action:
        patterns:
          - "github/codeql-action*"
