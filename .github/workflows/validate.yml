name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libglib2.0-bin
      - name: Build
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh
      - name: Validate zips
        run: |
          chmod +x tools/validate.sh
          ./tools/validate.sh
